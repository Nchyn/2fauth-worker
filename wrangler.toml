name = "2fauth-worker"
main = "backend/src/app/worker.ts" 
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "frontend/dist" 
not_found_handling = "single-page-application"

[build]
command = "npm run build --prefix frontend" 

[[d1_databases]]
binding = "DB"
database_name = "2fauth-db"

[triggers]
crons = ["0 2 * * *"]

[env.dev]
[[env.dev.d1_databases]]
binding = "DB"
database_name = "2fauth-db-dev"
database_id = "9e591736-5dbb-4f09-8769-0270d7257731"

[vars]
OAUTH_ALLOWED_USERS = "6263075@163.com"
OAUTH_GITHUB_CLIENT_ID = "Ov23li6ardnWYbZqwTSe"
OAUTH_TELEGRAM_BOT_NAME = "NchynsAstrBOT"
